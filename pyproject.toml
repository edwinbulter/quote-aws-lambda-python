[project]
name = "quote-aws-lambda-python"
version = "0.1.0"
description = "Flask + HTMX quote app, packaged to run as a single AWS Lambda behind API Gateway, backed by DynamoDB and Cognito"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "boto3>=1.34",
    "apig-wsgi>=2.18",
    "pyjwt[crypto]>=2.8",
    "requests>=2.31",
    "gunicorn>=22.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "moto[dynamodb,cognitoidp]>=5.0",
    "requests-mock>=1.12",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
ignore = [
    "RUF012", # mutable class-attribute defaults are fine for Flask config classes
    "BLE001", # health check / JWT verification deliberately catch broadly
]
